<!--
`nuxeo-embedding-search-search-form`
@group Nuxeo UI
@element nuxeo-embedding-search-search-form
-->
<dom-module id="nuxeo-embedding-search-search-form">
  <template>
    <style include="nuxeo-styles">
    </style>

    <nuxeo-input
                 role="widget"
                 id="searchInput"
                 type="search"
                 label="What is it you are looking for?"
                 value="{{params.input_text}}"
                 autofocus>
    </nuxeo-input>

    <label>Min Score</label>
    <paper-slider
            role="widget"
            id="minScoreSlider"
            label="Minimum Score"
            type="number"
            min="0"
            max="1"
            step="0.1"
            snaps
            value="{{params.min_score}}"
            placeholder="0.8"
            pin>
    </paper-slider>
    
    
  </template>

  <script>
    Polymer({
      is: 'nuxeo-embedding-search-search-form',
      behaviors: [Nuxeo.LayoutBehavior],
      properties: {

        params: {
          type: Object,
          notify: true,
          observer: '_paramsObserver'
        },
        
        searchTerm: {
          type: String,
          notify: true,
        },

        aggregations: {
          type: Object,
          value: {},
          notify: true,
        }

      }, 
      
      validate() {
        this.set('params.vector_index', "embedding:image");
        this.set('params.embedding_automation_processor','javascript.text2embedding');
        this.set('params.k',"10");
        return true
      },

      _paramsObserver(params) {
        if(!this.params.vector_index)
          this.set('params.vector_index', "embedding:image");
        if(!this.params.k)
          this.set('params.k', 10);
        if(!this.params.embedding_automation_processor)
          this.set('params.embedding_automation_processor', 'javascript.text2embedding');
        if(!this.params.min_score)
          this.set('params.min_score', 0.8);
      },
      
    });
  </script>
</dom-module>
